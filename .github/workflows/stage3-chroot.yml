name: Build Stage 3 (Chroot)

on:
  workflow_run:
    workflows: ["Build Stage 2"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run ID to download the stage2 rootfs artifact from'
        required: true
        type: string
      target_cpu_arch:
        description: 'Target CPU architecture'
        required: true
        default: 'x86_64'
        type: string

jobs:
  build:
    name: Build Stage 3 (Chroot)
    runs-on: depot-ubuntu-24.04-4
    permissions:
      actions: read
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download dos2unix
        run: sudo apt-get update && sudo apt-get install -y dos2unix

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve run ID and architecture
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_id=${{ github.event.inputs.run_id }}" >> "$GITHUB_OUTPUT"
            echo "arch=${{ github.event.inputs.target_cpu_arch }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "arch=x86_64" >> "$GITHUB_OUTPUT"
          fi

      - name: Download rootfs artifact
        uses: actions/download-artifact@v8
        with:
          pattern: rootfs-stage2-${{ steps.resolve.outputs.arch }}-*
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true

      - name: Unpack rootfs
        run: |
          ARTIFACT=$(find . -maxdepth 1 -name "rootfs-stage2-${{ steps.resolve.outputs.arch }}-*.tar.xz" | head -1)
          if [ -z "$ARTIFACT" ]; then
            echo "Error: No rootfs artifact found for arch ${{ steps.resolve.outputs.arch }}"
            exit 1
          fi
          mkdir -p rootfs-stage2 && tar -C rootfs-stage2 -xf "$ARTIFACT"
          rm -f "$ARTIFACT"

      - name: Download files from bootstrap-sources.list
        run: mkdir -p sources && wget -nv --tries=25 --waitretry=25 -i data/bootstrap-sources.list -P sources

      - name: Convert line endings of stage3-rootfs.sh to Unix format
        run: dos2unix stage3-rootfs.sh steps/*.sh *.sh

      - name: Run stage 3 build script to setup the rootfs
        run: |
          chmod +x stage3-rootfs.sh
          sudo ./stage3-rootfs.sh rootfs-stage2

      - name: Mount virtual filesystems
        run: |
          sudo mkdir -p rootfs-stage2/{proc,sys,dev/pts,run}
          sudo mount -t proc proc rootfs-stage2/proc
          sudo mount -t sysfs sysfs rootfs-stage2/sys
          sudo mount --bind /dev rootfs-stage2/dev
          sudo mount -t devpts devpts rootfs-stage2/dev/pts
          sudo mount -t tmpfs tmpfs rootfs-stage2/run

      - name: Check chroot environment
        run: |
          sudo chroot rootfs-stage2 ls

          sudo chroot rootfs-stage2 ls /opt

      - name: Run internal bootstrap script in chroot
        run: |
          sudo chroot rootfs-stage2 /opt/stage3-rootfs.sh

      - name: Unmount virtual filesystems
        if: always()
        run: |
          sudo umount -lf rootfs-stage2/run || true
          sudo umount -lf rootfs-stage2/dev/pts || true
          sudo umount -lf rootfs-stage2/dev || true
          sudo umount -lf rootfs-stage2/sys || true
          sudo umount -lf rootfs-stage2/proc || true

      - name: Repack rootfs
        run: |
          sudo chown -R root:root rootfs-stage2

          ARTIFACT="rootfs-stage3-${{ steps.resolve.outputs.arch }}-$(date +%Y%m%d%H%M%S).tar.xz"
          sudo tar -C rootfs-stage2 -cJf "$ARTIFACT" .

          sudo chown "$USER":"$USER" "$ARTIFACT"

      - name: Remove unneeded files
        run: |
          sudo rm -rf sources/ rootfs-stage2/ *.tar.xz
