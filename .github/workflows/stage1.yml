name: Build Stage 1

on:
  push:
    branches:
      - dev
      - copilot/*
  workflow_dispatch:

jobs:
  build:
    name: Run Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - TARGET_CPU_ARCH: x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies (Ubuntu/Debian)
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip tree wget curl make m4 rsync gawk autoconf automake libtool pkg-config sudo xz-utils build-essential texinfo

      - name: Download files from bootstrap-sources.list
        run: mkdir -p sources && wget -nv --tries=15 --waitretry=15 -i data/bootstrap-sources.list -P sources

      - name: Enable common functions
        run: chmod +x _common.sh

      - name: Enable staging scripts
        run: chmod +x stage*.sh

      - name: Setup toolchain
        run: |
          ./stage1-setup-toolchain.sh ${{ matrix.TARGET_CPU_ARCH }}
          ls -la .toolchains/${{ matrix.TARGET_CPU_ARCH }}-tools

      - name: Build chroot
        shell: bash
        run: |
          ./stage2-build-chroot.sh \
            "$GITHUB_WORKSPACE/.toolchains/${{ matrix.TARGET_CPU_ARCH }}-tools" \
            "${{ matrix.TARGET_CPU_ARCH }}" \
            "$GITHUB_WORKSPACE/rootfs"

      - name: Compress rootfs
        run: tar -C rootfs -cvJf rootfs-stage2-${{ matrix.TARGET_CPU_ARCH }}-${{ github.run_id }}.tar.xz .

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v6
        with:
          name: rootfs-stage2-${{ matrix.TARGET_CPU_ARCH }}-${{ github.run_id }}.tar.xz
          path: rootfs-stage2-${{ matrix.TARGET_CPU_ARCH }}-${{ github.run_id }}.tar.xz
