name: Build on GitHub Hosted Runner

on:
  push:
    branches:
      - dev
      - copilot/*
  workflow_dispatch:

jobs:
  build:
    name: Run Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - TARGET_CPU_ARCH: x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu/Debian)
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip tree wget curl make m4 rsync gawk autoconf automake libtool pkg-config sudo xz-utils build-essential texinfo

      - name: Download files from bootstrap-sources.list
        run: mkdir -p sources && wget -nv --tries=15 --waitretry=15 -i data/bootstrap-sources.list -P sources

      - name: Enable common functions
        run: chmod +x _common.sh

      - name: Enable staging scripts
        run: chmod +x stage*.sh

      - name: Setup toolchain
        run: |
          ./stage1-setup-toolchain.sh ${{ matrix.TARGET_CPU_ARCH }}
          ls -la .toolchains/${{ matrix.TARGET_CPU_ARCH }}-tools

      - name: Build chroot
        run: |
          set -o pipefail

          LOG_FILE="$PWD/bootstrap.log"

          # Start the build in the background and redirect output to a log file
          ./stage2-build-chroot.sh $PWD/.toolchains/${{ matrix.TARGET_CPU_ARCH }}-tools ${{ matrix.TARGET_CPU_ARCH }} $PWD/rootfs \
            >"$LOG_FILE" 2>&1 &
          BOOTSTRAP_PID=$!

          # Stream filtered output
          tail -F "$LOG_FILE" | grep --line-buffered -E "^ ==>" &
          TAIL_PID=$!

          # Wait for the build to finish
          wait $BOOTSTRAP_PID
          BUILD_EXIT_CODE=$?

          # Stop the tail process
          kill $TAIL_PID
          wait $TAIL_PID 2>/dev/null || true
          exit $BUILD_EXIT_CODE

          # If it failed, print last 150 lines of the log for debugging
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "Build failed. Last 150 lines of the log:"
            tail -n 150 "$LOG_FILE"
            exit $BUILD_EXIT_CODE
          fi
