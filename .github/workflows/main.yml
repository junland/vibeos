name: Build on GitHub Hosted Runner

on:
  workflow_dispatch:

jobs:
  build:
    name: Run Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - TARGET_ARCH: x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu/Debian)
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip tree wget curl make m4

      - name: Setup toolchain
        run: ./setup-toolchain.sh ${{ matrix.TARGET_ARCH }}
