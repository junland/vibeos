name: Build on GitHub Hosted Runner

on:
  push:
    branches:
      - dev
      - copilot/*
  workflow_dispatch:

jobs:
  build:
    name: Run Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - TARGET_CPU_ARCH: x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu/Debian)
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip tree wget curl make m4 rsync

      - name: Setup toolchain
        run: |
          chmod +x setup-toolchain.sh
          ./setup-toolchain.sh ${{ matrix.TARGET_CPU_ARCH }}

      - name: Bootstrap chroot
        run: |
          chmod +x bootstrap-chroot.sh
          ./bootstrap-chroot.sh .toolchains/${{ matrix.TARGET_CPU_ARCH }}-tools ${{ matrix.TARGET_CPU_ARCH }} $PWD/rootfs
