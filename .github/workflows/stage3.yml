name: Build Stage 3

on:
  workflow_run:
    workflows: ["Build Stage 2"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run ID to download the stage2 rootfs artifact from'
        required: true
        type: string
      target_cpu_arch:
        description: 'Target CPU architecture'
        required: true
        default: 'x86_64'
        type: string

jobs:
  build:
    name: Build Stage 3
    runs-on: ubuntu-latest
    permissions:
      actions: read
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download dos2unix
        run: sudo apt-get update && sudo apt-get install -y dos2unix

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve run ID and architecture
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_id=${{ github.event.inputs.run_id }}" >> "$GITHUB_OUTPUT"
            echo "arch=${{ github.event.inputs.target_cpu_arch }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "arch=x86_64" >> "$GITHUB_OUTPUT"
          fi

      - name: Download rootfs artifact
        uses: actions/download-artifact@v8
        with:
          pattern: rootfs-stage2-${{ steps.resolve.outputs.arch }}-*
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true

      - name: Unpack rootfs
        run: |
          ARTIFACT=$(find . -maxdepth 1 -name "rootfs-stage2-${{ steps.resolve.outputs.arch }}-*.tar.xz" | head -1)
          if [ -z "$ARTIFACT" ]; then
            echo "Error: No rootfs artifact found for arch ${{ steps.resolve.outputs.arch }}"
            exit 1
          fi
          mkdir -p rootfs-stage2 && tar -C rootfs-stage2 -xf "$ARTIFACT"
          rm -f "$ARTIFACT"

      - name: Download files from bootstrap-sources.list
        run: mkdir -p sources && wget -nv --tries=25 --waitretry=25 -i data/bootstrap-sources.list -P sources

      - name: Convert line endings of stage3-rootfs-build.sh to Unix format
        run: dos2unix stage3-rootfs-build.sh steps/*.sh *.sh

      - name: Run stage 3 build script to setup the rootfs
        run: |
          chmod +x stage3-rootfs-build.sh
          sudo ./stage3-rootfs-build.sh rootfs-stage2

      - name: Repack rootfs
        run: |
          sudo chown -R root:root rootfs-stage2

          ARTIFACT="rootfs-stage2-${{ steps.resolve.outputs.arch }}-$(date +%Y%m%d%H%M%S).tar.xz"
          sudo tar -C rootfs-stage2 -cJf "$ARTIFACT" .

          sudo chown "$USER":"$USER" "$ARTIFACT"

      - name: Import rootfs into Docker
        run: |
          ARTIFACT=$(find . -maxdepth 1 -name "rootfs-stage2-${{ steps.resolve.outputs.arch }}-*.tar.xz" | head -1)
          if [ -z "$ARTIFACT" ]; then
            echo "Error: No rootfs artifact found for arch ${{ steps.resolve.outputs.arch }}"
            exit 1
          fi
          docker import "$ARTIFACT" vibeos:${{ steps.resolve.outputs.arch }}-latest
          docker images vibeos

      - name: Remove unneeded files
        run: |
          sudo rm -rf sources/ rootfs/ rootfs-stage2/ *.tar.xz

      - name: Check Docker image
        run: |
          docker run -t --rm vibeos:${{ steps.resolve.outputs.arch }}-latest ls

          docker run -t --rm vibeos:${{ steps.resolve.outputs.arch }}-latest ls /opt

      - name: Run internal bootstrap script
        run: |
          docker run -t --rm -w /opt vibeos:${{ steps.resolve.outputs.arch }}-latest /opt/stage3-rootfs-build.sh

